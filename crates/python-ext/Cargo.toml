[package]
name = "codebones-python-ext"
version = "0.7.0"
edition = "2021"
description = "Python bindings for codebones"
license = "MIT"
repository = "https://github.com/creynir/codebones"

[[bin]]
name = "codebones"
path = "../cli/src/main.rs"

[[bin]]
name = "codebones-mcp"
path = "../mcp/src/main.rs"

[dependencies]
codebones-core = { path = "../core", version = "0.7.0" }
clap = { version = "4.6.0", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
rmcp = { version = "1.2.0", features = ["client", "transport-async-rw", "transport-io"] }
anyhow = "1.0.102"
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
dirs = "5"

[dev-dependencies]
assert_cmd = "2.2.0"
tempfile = "3.27.0"
predicates = "3.1.4"
