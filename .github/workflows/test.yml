name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call: # Allow other workflows to call this

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --exclude codebones-python-ext

      - name: Check Python Packaging Crate
        run: cargo check -p codebones-python-ext

      - name: Check Python Package Version Parity
        run: python scripts/check_python_package_version.py

      - name: Build And Smoke Test Python Wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          maturin build --release --out dist -m crates/python-ext/Cargo.toml
          python -m pip install --force-reinstall dist/*.whl
          codebones --version
          python scripts/mcp_stdio_smoke.py
